<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Event Check-In</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9C%93%3C/text%3E%3C/svg%3E" />

  <!-- QR scanner: html5-qrcode (Apache-2.0) loaded from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #22d3ee;
      --accent-hover: #06b6d4;
      --success: #16a34a;
      --success-bg: #052e16;
      --warning: #f59e0b;
      --warning-bg: #422006;
      --danger: #ef4444;
      --danger-bg: #450a0a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 2px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    .subtitle { color: var(--muted); font-size: 12px; }

    main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }

    /* ── Live event stats (top of app, refreshes on every check-in) ── */
    .stats-card { padding: 12px 14px; }
    .stats-event {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .stats-event .stats-event-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .stats-event .stats-event-id {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .stat-cell {
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .stat-cell.checked-in { border-color: #14532d; }
    .stat-cell.members    { border-color: #155e75; }
    .stat-cell.paid       { border-color: #b45309; }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .stat-cell.checked-in .stat-value { color: #4ade80; }
    .stat-cell.members .stat-value    { color: #22d3ee; }
    .stat-cell.paid .stat-value       { color: #fbbf24; }

    .stat-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 3px;
      font-weight: 600;
    }

    /* Loading state: shown while current-event is in flight */
    .stats-card.loading .stat-value {
      color: var(--muted);
      animation: stats-pulse 1.2s ease-in-out infinite;
    }
    .stats-card.loading .stat-cell { opacity: 0.7; }
    .stats-card.loading .stat-cell.checked-in,
    .stats-card.loading .stat-cell.members,
    .stats-card.loading .stat-cell.paid {
      /* mute the accent borders while loading */
      border-color: var(--border);
    }
    @keyframes stats-pulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    .stats-loading-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-style: normal;
    }
    .stats-loading-label .mini-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* Scanner */
    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    #reader video { width: 100% !important; height: auto !important; display: block; }

    .scanner-empty {
      text-align: center;
      padding: 16px 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .scanner-empty svg { width: 36px; height: 36px; opacity: 0.6; margin-bottom: 6px; }

    /* Buttons */
    .btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }
    .btn:active { transform: scale(0.99); }
    .btn-primary { background: var(--accent); color: #001218; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #ecfdf5; }
    .btn-success:hover { background: #15803d; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover { background: var(--panel-2); }
    .btn[disabled] { opacity: 0.55; cursor: not-allowed; }

    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }

    /* Manual entry */
    .manual {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .manual input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .manual input:focus { border-color: var(--accent); }
    .manual button { padding: 10px 14px; }

    /* Status messages */
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .alert-error   { background: var(--danger-bg);  border-color: #7f1d1d; color: #fecaca; }
    .alert-warning { background: var(--warning-bg); border-color: #78350f; color: #fde68a; }
    .alert-success { background: var(--success-bg); border-color: #14532d; color: #bbf7d0; }
    .alert b { font-weight: 600; }

    /* Registrant details */
    .name {
      margin: 0 0 2px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .email {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
      word-break: break-all;
    }
    dl.details {
      margin: 0;
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 14px;
      row-gap: 6px;
      font-size: 13px;
    }
    dl.details dt { color: var(--muted); }
    dl.details dd { margin: 0; color: var(--text); }

    /* Payment status — bold + highlighted (per spec) */
    .payment-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ── Member status banner ────────────────────────────────────
       Most prominent thing on the card. Front-desk staff must be able
       to read it from across the table. */
    .member-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin: 0 0 12px;
      border-radius: 12px;
      font-weight: 700;
    }
    .member-banner .mb-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.18);
    }
    .member-banner .mb-icon svg { width: 18px; height: 18px; }
    .member-banner .mb-title {
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .member-banner .mb-sub {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.95;
      letter-spacing: 0.01em;
      margin-top: 1px;
    }
    .member-banner .mb-sub .mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .member-yes {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      color: #ffffff;
      box-shadow: 0 2px 14px rgba(22, 101, 52, 0.35), inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .member-no {
      background: linear-gradient(135deg, #b45309 0%, #9a3412 100%);
      color: #fff7ed;
      box-shadow: 0 2px 14px rgba(154, 52, 18, 0.35), inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    /* Already-paid badge (shown if fee was previously recorded) */
    .fee-paid-banner {
      padding: 10px 12px;
      border-radius: 10px;
      background: #052e16;
      border: 1px solid #14532d;
      color: #bbf7d0;
      font-size: 13px;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .fee-paid-banner b { font-weight: 700; }

    /* ── Fee picker (non-members only) ───────────────────────────── */
    .fee-block {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .fee-block .fee-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .fee-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .fee-opt {
      display: flex; flex-direction: column;
      align-items: stretch; justify-content: center;
      padding: 8px 8px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.04s ease;
      text-align: center;
    }
    .fee-opt:active { transform: scale(0.99); }
    .fee-opt.selected {
      background: var(--accent);
      color: #001218;
      border-color: var(--accent);
    }
    .fee-opt .fee-opt-sub {
      font-size: 10px;
      font-weight: 500;
      opacity: 0.75;
      margin-top: 2px;
    }
    .fee-custom {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }
    .fee-custom label {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .fee-custom input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      text-align: right;
    }
    .fee-custom input:focus { border-color: var(--accent); }
    .fee-custom .fee-aed { color: var(--muted); font-size: 12px; }
    .payment-paid     { background: #dcfce7; color: #14532d; box-shadow: inset 0 0 0 1px #4ade80; }
    .payment-unpaid   { background: #fee2e2; color: #7f1d1d; box-shadow: inset 0 0 0 1px #f87171; }
    .payment-pending  { background: #fef3c7; color: #78350f; box-shadow: inset 0 0 0 1px #fbbf24; }
    .payment-other    { background: #e0e7ff; color: #312e81; box-shadow: inset 0 0 0 1px #818cf8; }

    .actions { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

    .check-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--success-bg);
      border: 1px solid #14532d;
      color: #bbf7d0;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .check-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Loader */
    .loader {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 8px 0 12px;
    }
    footer code {
      background: var(--panel-2);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Event Check-In</h1>
        <div class="subtitle">Scan a registrant's QR code</div>
      </div>
    </header>

    <main>
      <!-- ─── EVENT STATS (loaded once on page load, updated locally) ─── -->
      <section class="card stats-card loading" id="stats-card" aria-live="polite">
        <div class="stats-event">
          <div class="stats-event-name" id="stat-event-name">
            <span class="stats-loading-label">
              <span class="mini-spinner" aria-hidden="true"></span>
              Loading event stats…
            </span>
          </div>
          <div class="stats-event-id" id="stat-event-id"></div>
        </div>
        <div class="stats-grid">
          <div class="stat-cell">
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-cell checked-in">
            <div class="stat-value" id="stat-checked-in">—</div>
            <div class="stat-label">Checked&nbsp;In</div>
          </div>
          <div class="stat-cell members">
            <div class="stat-value" id="stat-members">—</div>
            <div class="stat-label">Members</div>
          </div>
          <div class="stat-cell paid">
            <div class="stat-value" id="stat-paid">—</div>
            <div class="stat-label">Paid</div>
          </div>
        </div>
      </section>

      <!-- ─── SCANNER CARD ─── -->
      <section class="card" id="scanner-card">
        <h2>Scanner</h2>

        <div id="reader-wrap">
          <div id="reader"></div>
          <div id="scanner-empty" class="scanner-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 19h3"/>
            </svg>
            <div>Tap <b>Start Scanner</b> to use the camera</div>
          </div>
        </div>

        <div class="actions">
          <button id="btn-start" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Start Scanner
          </button>
          <button id="btn-stop" class="btn btn-ghost hidden">Stop Scanner</button>
        </div>

        <div class="manual">
          <input id="manual-id" inputmode="text" placeholder="Or enter ID manually (e.g. 6845)" />
          <button id="btn-manual" class="btn btn-ghost">Look up</button>
        </div>
      </section>

      <!-- ─── STATUS AREA ─── -->
      <div id="status-area"></div>

      <!-- ─── REGISTRANT DETAILS ─── -->
      <section class="card hidden" id="details-card" aria-live="polite"></section>
    </main>

    <footer>
      <span id="cache-status" class="hidden" style="color:#22d3ee;font-weight:600">●</span>
      Built for event check-in · <code id="cfg-host">backend not configured</code>
      · <a href="#" id="test-conn" style="color:var(--accent);text-decoration:none">Test backend</a>
    </footer>
  </div>

  <!-- Frontend config (Apps Script Web App URL goes here) -->
  <script src="./config.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  Event Check-In  — frontend logic
    // ════════════════════════════════════════════════════════════════
    (function () {
      'use strict';

      const cfg = window.APP_CONFIG || {};
      const BACKEND_URL = cfg.backendUrl || '';

      // Surface the configured host in the footer for quick sanity-check.
      const hostEl = document.getElementById('cfg-host');
      if (BACKEND_URL) {
        try { hostEl.textContent = new URL(BACKEND_URL).host; }
        catch { hostEl.textContent = 'backend configured'; }
      }

      // ── DOM refs ──
      const $ = (id) => document.getElementById(id);
      const readerEl     = $('reader');
      const readerEmpty  = $('scanner-empty');
      const btnStart     = $('btn-start');
      const btnStop      = $('btn-stop');
      const btnManual    = $('btn-manual');
      const manualInput  = $('manual-id');
      const statusArea   = $('status-area');
      const detailsCard  = $('details-card');

      let scanner = null;
      let scanning = false;
      let lastScanAt = 0;

      // ── Local registrant cache ─────────────────────────────────────
      //
      // After the first successful lookup we fire a background prefetch
      // that pulls every registrant for that event in one call. From
      // then on, scans hit this Map and return instantly.
      //
      // localCache: Map<string id, registrantObject>
      // prefetchedEventId: which event we've already prefetched (so we
      //                    don't prefetch the same one twice)
      const localCache = new Map();
      let prefetchedEventId = null;
      let prefetching = false;
      let currentEventInfo = null;  // { eventId, eventName, eventDate }

      // ── Helpers ──
      function setStatus(html) {
        statusArea.innerHTML = html || '';
      }

      function showError(msg) {
        setStatus(`<div class="alert alert-error">⚠️ <div>${msg}</div></div>`);
      }

      function showWarning(msg) {
        setStatus(`<div class="alert alert-warning">⚠️ <div>${msg}</div></div>`);
      }

      function showSuccess(msg) {
        setStatus(`<div class="alert alert-success">✓ <div>${msg}</div></div>`);
      }

      function hideDetails() {
        detailsCard.classList.add('hidden');
        detailsCard.innerHTML = '';
      }

      /**
       * Extract a registrant ID from whatever the QR code contained.
       * Supports:
       *   1. URLs with `?id=…` query (the format you shared)
       *   2. URLs with `id` inside the fragment
       *   3. Raw numeric / alphanumeric IDs
       */
      function extractIdFromScan(text) {
        if (!text) return null;
        const trimmed = String(text).trim();

        // Try parsing as URL first
        try {
          const u = new URL(trimmed);
          const fromQuery = u.searchParams.get('id');
          if (fromQuery) return fromQuery;

          // Some systems put params in the hash
          if (u.hash && u.hash.includes('=')) {
            const hashParams = new URLSearchParams(u.hash.replace(/^#/, ''));
            const fromHash = hashParams.get('id');
            if (fromHash) return fromHash;
          }
        } catch (_) {
          /* not a URL — fall through */
        }

        // Pull `id=<value>` out of any string as a fallback
        const m = trimmed.match(/[?&;]id=([^&;\s]+)/i);
        if (m) return decodeURIComponent(m[1]);

        // Otherwise treat the whole text as an ID
        return trimmed;
      }

      function formatDateTime(value) {
        if (!value) return '—';
        if (typeof value === 'string') return value;
        try {
          const d = new Date(value);
          if (isNaN(d.getTime())) return String(value);
          const pad = (n) => String(n).padStart(2, '0');
          return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        } catch {
          return String(value);
        }
      }

      function paymentPillClass(status) {
        const s = String(status || '').toLowerCase().trim();
        if (s === 'paid')    return 'payment-paid';
        if (s === 'unpaid' || s === 'failed' || s === 'cancelled') return 'payment-unpaid';
        if (s === 'pending' || s === 'awaiting') return 'payment-pending';
        return 'payment-other';
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      // ── Renderer ──
      function renderRegistrant(r, opts) {
        opts = opts || {};
        const fullName = [r.firstName, r.lastName].filter(Boolean).join(' ') || '(no name)';
        const alreadyIn = String(r.checkedIn || '').trim().toLowerCase() === 'yes';

        const banner = (opts.justCheckedIn)
          ? `<div class="check-banner">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
               Checked in at ${escapeHtml(formatDateTime(r.checkedInTime))}
             </div>`
          : (alreadyIn && !opts.justCheckedIn)
            ? `<div class="check-banner" style="background:#422006;border-color:#78350f;color:#fde68a">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
                 Already checked in at ${escapeHtml(formatDateTime(r.checkedInTime))}
               </div>`
            : '';

        const pillClass = paymentPillClass(r.paymentStatus);
        const paymentLabel = r.paymentStatus ? escapeHtml(r.paymentStatus) : '—';

        // ── Membership status ─────────────────────────────────────
        // PMI ID coming back from the sheet means the email matched a
        // row in ActiveMembersList. Empty / blank → non-member, and the
        // front-desk staff will collect the AED fee.
        const pmiIdValue = (r.pmiId == null || String(r.pmiId).trim() === '') ? '' : String(r.pmiId).trim();
        const isMember = pmiIdValue !== '';

        // Button label varies based on member status so staff sees at
        // a glance what action they're about to take. The actual amount
        // and mode are read from the fee picker at click time.
        const checkInBtnInner = isMember
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Check-In`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Check-In &amp; Record Fee`;

        const actions = opts.justCheckedIn
          ? `<button class="btn btn-ghost" id="btn-next">Scan next</button>`
          : alreadyIn
            ? `<button class="btn btn-success" id="btn-checkin" data-force="1">Re-check in anyway</button>
               <button class="btn btn-ghost" id="btn-next">Scan next</button>`
            : `<button class="btn btn-success" id="btn-checkin">${checkInBtnInner}</button>
               <button class="btn btn-ghost" id="btn-cancel">Cancel</button>`;

        const memberBanner = isMember
          ? `<div class="member-banner member-yes">
               <div class="mb-icon">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M20 6L9 17l-5-5"/></svg>
               </div>
               <div>
                 <div class="mb-title">PMI Member</div>
                 <div class="mb-sub">PMI ID: <span class="mono">${escapeHtml(pmiIdValue)}</span></div>
               </div>
             </div>`
          : `<div class="member-banner member-no">
               <div class="mb-icon">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
               </div>
               <div>
                 <div class="mb-title">Non-Member</div>
                 <div class="mb-sub">Collect AED&nbsp;200 or mark as complimentary</div>
               </div>
             </div>`;

        // ── Fee record (if one already exists from a prior scan) ────
        const feeAmtNum = Number(r.feeAmount);
        const feePreviouslyRecorded = (r.feeTime != null && String(r.feeTime).trim() !== '');
        const feeAlreadyBanner = feePreviouslyRecorded
          ? `<div class="fee-paid-banner">
               ${feeAmtNum > 0
                 ? `Fee already collected: <b>AED ${escapeHtml(feeAmtNum.toFixed(2))}</b> at ${escapeHtml(formatDateTime(r.feeTime))}`
                 : `Marked <b>Complimentary</b> at ${escapeHtml(formatDateTime(r.feeTime))}`}
             </div>`
          : '';

        // ── Fee picker (non-members only, only if not already recorded) ──
        // Two quick-pick buttons plus a custom input that ALWAYS shows
        // the amount about to be recorded. This way the volunteer can
        // see "200" or "0" in the field and know exactly what will be
        // written to the sheet.
        const feeBlock = (!isMember && !feePreviouslyRecorded)
          ? `<div class="fee-block">
               <div class="fee-label">Fee collection</div>
               <div class="fee-options">
                 <button type="button" class="fee-opt selected" data-fee-mode="standard" data-fee-value="200">
                   AED 200
                   <span class="fee-opt-sub">standard fee</span>
                 </button>
                 <button type="button" class="fee-opt" data-fee-mode="complimentary" data-fee-value="0">
                   Complimentary
                   <span class="fee-opt-sub">guest / speaker</span>
                 </button>
               </div>
               <div class="fee-custom">
                 <label for="fee-custom-amount">Amount:</label>
                 <input id="fee-custom-amount" type="number" inputmode="numeric" min="0" step="1" value="200" />
                 <span class="fee-aed">AED</span>
               </div>
             </div>`
          : '';

        const pmiIdRow = pmiIdValue
          ? `<dt>PMI ID</dt><dd><strong>${escapeHtml(pmiIdValue)}</strong></dd>`
          : '';

        detailsCard.innerHTML = `
          ${memberBanner}
          ${banner}
          ${feeAlreadyBanner}
          <div class="name">${escapeHtml(fullName)}</div>
          <div class="email">${escapeHtml(r.email || '')}</div>

          <dl class="details">
            <dt>Registered</dt>      <dd>${escapeHtml(formatDateTime(r.registrationDate))}</dd>
            <dt>Payment Status</dt>  <dd><span class="payment-pill ${pillClass}">${paymentLabel}</span></dd>
            ${pmiIdRow}
            <dt>Reg ID</dt>          <dd style="color:var(--muted)">${escapeHtml(r.id || '—')}</dd>
          </dl>

          ${feeBlock}

          <div class="actions">${actions}</div>
        `;

        // Wire the fee picker. The custom input is the single source of
        // truth for the amount. Buttons act as quick-fills:
        //   AED 200       → input = "200", "standard" highlighted
        //   Complimentary → input = "0",   "complimentary" highlighted
        //   typing manually → no preset highlighted (user is overriding)
        const feeButtons = detailsCard.querySelectorAll('.fee-opt');
        const customInput = detailsCard.querySelector('#fee-custom-amount');
        function setFeeAmount(value, modeFromButton) {
          if (customInput) customInput.value = String(value);
          feeButtons.forEach((b) => {
            b.classList.toggle('selected', b.dataset.feeMode === modeFromButton);
          });
        }
        feeButtons.forEach((btn) => {
          btn.addEventListener('click', () => {
            setFeeAmount(btn.dataset.feeValue, btn.dataset.feeMode);
          });
        });
        if (customInput) {
          customInput.addEventListener('input', () => {
            // User typed — deselect both quick buttons unless they
            // happened to type a value matching one of them.
            const val = customInput.value.trim();
            let matchedMode = null;
            feeButtons.forEach((b) => {
              if (b.dataset.feeValue === val) matchedMode = b.dataset.feeMode;
            });
            feeButtons.forEach((b) => {
              b.classList.toggle('selected', b.dataset.feeMode === matchedMode);
            });
          });
        }

        detailsCard.classList.remove('hidden');

        // Hide the scanner card so the result fills the viewport and the
        // volunteer doesn't have to scroll past the (now-stopped) camera.
        // resetView() un-hides it when the user taps Cancel / Scan Next.
        const scannerCardEl = document.getElementById('scanner-card');
        if (scannerCardEl) scannerCardEl.classList.add('hidden');

        // Make sure the details card is visible — scroll to top in case
        // the page was scrolled before this scan.
        try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (_) {}

        // Wire buttons
        const checkinBtn = $('btn-checkin');
        if (checkinBtn) {
          checkinBtn.addEventListener('click', () => {
            const force = checkinBtn.dataset.force === '1';
            // Read what the fee picker currently has selected (only
            // visible for non-members on a fresh check-in). For members,
            // or when re-check-in is happening, recordFee stays false.
            const feeData = readFeePicker_(detailsCard, isMember, feePreviouslyRecorded);
            checkInRegistrant(r.id, force, feeData);
          });
        }
        const cancelBtn = $('btn-cancel');
        if (cancelBtn) cancelBtn.addEventListener('click', resetView);
        const nextBtn = $('btn-next');
        if (nextBtn) nextBtn.addEventListener('click', resetView);
      }

      function resetView() {
        hideDetails();
        setStatus('');
        manualInput.value = '';
        const scannerCardEl = document.getElementById('scanner-card');
        if (scannerCardEl) scannerCardEl.classList.remove('hidden');
      }

      // ── Backend ──
      function requireBackend() {
        if (!BACKEND_URL) {
          showError('Backend URL not configured. Edit <code>config.js</code> and set <b>backendUrl</b> to your deployed Apps Script <code>/exec</code> URL.');
          return false;
        }
        return true;
      }

      /**
       * Wrapper around fetch() that gives meaningful diagnostics when the
       * backend isn't behaving — instead of the opaque "Load failed".
       *
       * Cases it surfaces explicitly:
       *  - Apps Script returned an HTML page (deployment access is wrong)
       *  - Apps Script returned non-2xx
       *  - Body wasn't JSON
       *  - Underlying fetch threw (CORS / offline / DNS / etc.)
       */
      async function callBackend(url, init) {
        let res;
        try {
          res = await fetch(url, Object.assign({ redirect: 'follow', cache: 'no-store' }, init || {}));
        } catch (err) {
          const hint = (err && err.message && /Load failed|Failed to fetch|NetworkError/i.test(err.message))
            ? ' (This usually means CORS or the device is offline. Open the backend URL directly in a browser tab to verify it returns JSON.)'
            : '';
          throw new Error('Could not reach backend: ' + (err && err.message ? err.message : String(err)) + hint);
        }

        const ct = res.headers.get('content-type') || '';
        const text = await res.text();

        if (!res.ok) {
          throw new Error('Backend returned HTTP ' + res.status + (text ? ' — ' + text.slice(0, 200) : ''));
        }

        // Apps Script returns HTML when "Who has access" isn't set to "Anyone".
        if (ct.includes('text/html') || /<\!doctype html|<html/i.test(text)) {
          throw new Error('Backend returned an HTML page instead of JSON. Open Apps Script → Deploy → Manage deployments → set "Who has access" to "Anyone", then redeploy.');
        }

        try {
          return JSON.parse(text);
        } catch (_) {
          throw new Error('Backend response was not JSON: ' + text.slice(0, 200));
        }
      }

      async function lookupRegistrant(rawScan) {
        if (!requireBackend()) return;
        const id = extractIdFromScan(rawScan);
        if (!id) { showError('Could not extract an ID from the scanned code.'); return; }

        hideDetails();

        // ── Fast path: serve from local cache if we have it ─────────
        // This is the win that makes scanning feel instant after the
        // first lookup of the event. We still render right away; if
        // the user then taps Check-In, the server confirms canonical
        // state at write time.
        const cached = localCache.get(String(id));
        if (cached) {
          setStatus('');
          renderRegistrant(cached);
          return;
        }

        setStatus(`<div class="alert">Looking up ID <b>${escapeHtml(id)}</b>…</div>`);

        try {
          const url = `${BACKEND_URL}?action=lookup&id=${encodeURIComponent(id)}`;
          const data = await callBackend(url, { method: 'GET' });

          if (!data.ok) {
            showError(data.error === 'Registrant not found'
              ? `No registrant found for ID <b>${escapeHtml(id)}</b>.`
              : escapeHtml(data.error || 'Lookup failed.'));
            return;
          }
          setStatus('');
          const registrant = data.registrant.data || data.registrant;
          // Seed the local cache with what we just fetched
          if (registrant.id != null) localCache.set(String(registrant.id), registrant);
          renderRegistrant(registrant);

          // ── Background prefetch: once we know which event this
          // person belongs to, slurp every registrant for that event
          // so subsequent scans are instant. Fire-and-forget; the UI
          // doesn't wait on it.
          if (registrant.eventId != null
              && String(registrant.eventId) !== String(prefetchedEventId)
              && !prefetching) {
            prefetchEvent(registrant.eventId);
          }
        } catch (err) {
          showError(escapeHtml(err.message || String(err)));
        }
      }

      async function prefetchEvent(eventId) {
        prefetching = true;
        try {
          const url = `${BACKEND_URL}?action=event&id=${encodeURIComponent(eventId)}`;
          const data = await callBackend(url, { method: 'GET' });
          if (data.ok && Array.isArray(data.registrants)) {
            for (const r of data.registrants) {
              if (r && r.id != null) localCache.set(String(r.id), r);
            }
            prefetchedEventId = String(eventId);
            const indicator = document.getElementById('cache-status');
            if (indicator) {
              indicator.classList.remove('hidden');
              indicator.title = `${data.count} registrants pre-loaded for event ${eventId}`;
              indicator.textContent = `● ${data.count} loaded`;
            }
          }
        } catch (e) {
          // Prefetch failures are non-fatal — we'll just fall back to
          // per-scan lookups. Log to console for debugging.
          console.warn('Prefetch failed:', e);
        } finally {
          prefetching = false;
        }
      }

      /**
       * Read the fee amount to record from the picker on the card.
       *
       * The custom input is the single source of truth — buttons just
       * fill it in. Returns { recordFee, feeAmount } for the backend:
       *   • recordFee=false → don't touch the fee columns (members,
       *     re-check-in of already-recorded entries)
       *   • recordFee=true, feeAmount=0  → complimentary
       *   • recordFee=true, feeAmount>0  → that amount in AED
       */
      function readFeePicker_(card, isMember, alreadyRecorded) {
        if (isMember || alreadyRecorded) return { recordFee: false };

        const customInput = card.querySelector('#fee-custom-amount');
        const raw = customInput ? customInput.value.trim() : '';
        const num = Number(raw);

        // Empty input is treated as the default standard fee, not as 0,
        // to prevent accidental "free" check-ins when staff clears the field.
        if (raw === '' || !isFinite(num) || num < 0) {
          return { recordFee: true, feeAmount: 200 };
        }
        return { recordFee: true, feeAmount: num };
      }

      async function checkInRegistrant(id, force, feeData) {
        if (!requireBackend()) return;
        const btn = $('btn-checkin');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="loader"></span> Checking in…';
        }

        try {
          const payload = { action: 'checkin', id: id, force: !!force };
          if (feeData && feeData.recordFee) {
            payload.recordFee = true;
            payload.feeAmount = Number(feeData.feeAmount) || 0;
          }
          // Debug: visible in browser DevTools so you can verify what's
          // being sent during check-in. Especially useful when fees seem
          // to not get recorded.
          try { console.log('[check-in payload]', payload); } catch (_) {}
          // text/plain avoids the CORS preflight that application/json triggers.
          const data = await callBackend(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
          });
          try { console.log('[check-in response]', data); } catch (_) {}

          if (data.ok) {
            setStatus('');
            // Refresh local cache so a re-scan of the same QR shows
            // the new checked-in state without another round trip.
            if (data.registrant && data.registrant.id != null) {
              localCache.set(String(data.registrant.id), data.registrant);
            }
            renderStats();   // tick the stats bar
            renderRegistrant(data.registrant, { justCheckedIn: true });
            return;
          }

          if (data.alreadyCheckedIn) {
            if (data.registrant && data.registrant.id != null) {
              localCache.set(String(data.registrant.id), data.registrant);
            }
            renderStats();
            showWarning(`Already checked in at <b>${escapeHtml(formatDateTime(data.previousTime))}</b>. Tap <b>Re-check in anyway</b> to override.`);
            renderRegistrant(data.registrant);
            return;
          }

          showError(escapeHtml(data.error || 'Check-in failed.'));
          if (btn) { btn.disabled = false; btn.innerHTML = 'Check-In'; }
        } catch (err) {
          showError(escapeHtml(err.message || String(err)));
          if (btn) { btn.disabled = false; btn.innerHTML = 'Check-In'; }
        }
      }

      // ── Scanner ──
      function onScanSuccess(decodedText) {
        // Debounce: html5-qrcode fires repeatedly while a code stays in frame.
        const now = Date.now();
        if (now - lastScanAt < 2000) return;
        lastScanAt = now;

        stopScanner();
        lookupRegistrant(decodedText);
      }

      function onScanError(_msg) {
        // Suppress per-frame "not found" errors; they're expected.
      }

      async function startScanner() {
        if (scanning) return;
        if (!window.Html5Qrcode) {
          showError('Scanner library failed to load. Check your internet connection and refresh.');
          return;
        }

        readerEmpty.classList.add('hidden');
        btnStart.classList.add('hidden');
        btnStop.classList.remove('hidden');
        setStatus('');
        hideDetails();

        scanner = scanner || new Html5Qrcode('reader');
        const config = {
          fps: 10,
          qrbox: (vw, vh) => {
            const m = Math.min(vw, vh);
            const s = Math.floor(m * 0.7);
            return { width: s, height: s };
          },
          aspectRatio: 1.0,
          rememberLastUsedCamera: true,
        };

        try {
          await scanner.start(
            { facingMode: 'environment' },
            config,
            onScanSuccess,
            onScanError
          );
          scanning = true;
        } catch (err) {
          scanning = false;
          btnStop.classList.add('hidden');
          btnStart.classList.remove('hidden');
          readerEmpty.classList.remove('hidden');
          showError(`Couldn't start camera: ${escapeHtml(err.message || String(err))}. Make sure the page is served over HTTPS and that you've granted camera permission.`);
        }
      }

      async function stopScanner() {
        if (!scanner || !scanning) return;
        try { await scanner.stop(); } catch (_) {}
        try { await scanner.clear(); } catch (_) {}
        scanning = false;
        btnStop.classList.add('hidden');
        btnStart.classList.remove('hidden');
        readerEmpty.classList.remove('hidden');
      }

      // ── Wire up UI ──
      btnStart.addEventListener('click', startScanner);
      btnStop.addEventListener('click', stopScanner);
      btnManual.addEventListener('click', () => {
        const v = manualInput.value.trim();
        if (!v) { manualInput.focus(); return; }
        lookupRegistrant(v);
      });
      manualInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btnManual.click();
      });

      // "Test backend" — pings the Apps Script with ?action=ping
      const testBtn = $('test-conn');
      if (testBtn) {
        testBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          if (!requireBackend()) return;
          setStatus(`<div class="alert">Testing backend…</div>`);
          try {
            const data = await callBackend(`${BACKEND_URL}?action=ping`, { method: 'GET' });
            if (data.ok) {
              showSuccess(`Backend reachable. Server time: <b>${escapeHtml(data.time || '?')}</b>`);
            } else {
              showError(escapeHtml(data.error || 'Backend returned ok=false'));
            }
          } catch (err) {
            showError(escapeHtml(err.message || String(err)));
          }
        });
      }

      // ── Live event stats ───────────────────────────────────────────
      // The stats card at the top of the app shows totals for the event
      // currently selected on the Summary tab (cell B3). We fetch the
      // event + its registrants once on page load, then keep the numbers
      // in sync locally as check-ins happen — no extra network calls.

      function computeStats(eventId) {
        const result = { total: 0, checkedIn: 0, members: 0, paid: 0 };
        if (!eventId) return result;
        const target = String(eventId);
        localCache.forEach((r) => {
          if (String(r.eventId) !== target) return;
          result.total++;
          const isCheckedIn = String(r.checkedIn || '').trim().toLowerCase() === 'yes';
          if (!isCheckedIn) return;
          result.checkedIn++;
          const isMember = r.pmiId != null && String(r.pmiId).trim() !== '';
          const feeAmt = Number(r.feeAmount) || 0;
          if (isMember) result.members++;
          else if (feeAmt > 0) result.paid++;
          // Complimentary check-ins (non-member, fee=0) aren't shown
          // as their own tile but still count toward "Checked In".
        });
        return result;
      }

      function renderStats() {
        const card = document.getElementById('stats-card');
        if (!card) return;
        if (!currentEventInfo) { card.classList.add('hidden'); return; }
        const s = computeStats(currentEventInfo.eventId);

        const nameEl = document.getElementById('stat-event-name');
        const idEl   = document.getElementById('stat-event-id');
        if (nameEl) nameEl.textContent = currentEventInfo.eventName ||
          ('Event ' + currentEventInfo.eventId);
        if (idEl) idEl.textContent = 'ID ' + currentEventInfo.eventId;

        document.getElementById('stat-total').textContent      = s.total;
        document.getElementById('stat-checked-in').textContent = s.checkedIn;
        document.getElementById('stat-members').textContent    = s.members;
        document.getElementById('stat-paid').textContent       = s.paid;

        // Swap out of the loading state once real numbers are in place
        card.classList.remove('hidden', 'loading');
      }

      async function loadCurrentEvent() {
        const card = document.getElementById('stats-card');
        if (!BACKEND_URL) {
          if (card) card.classList.add('hidden');
          return;
        }
        // Card already starts in `.loading` state from the HTML, so the
        // spinner is visible the moment the page paints. We just need to
        // either populate it or hide it depending on the response.
        try {
          const url = `${BACKEND_URL}?action=current-event`;
          const data = await callBackend(url, { method: 'GET' });
          if (!data || !data.ok) {
            console.warn('current-event:', data && data.error);
            if (card) card.classList.add('hidden');
            return;
          }
          currentEventInfo = {
            eventId: data.eventId,
            eventName: data.eventName,
            eventDate: data.eventDate,
          };
          // Pre-fill the local cache so the very first scan is a cache hit.
          if (Array.isArray(data.registrants)) {
            for (const r of data.registrants) {
              if (r && r.id != null) localCache.set(String(r.id), r);
            }
            prefetchedEventId = String(data.eventId);
          }
          renderStats();
        } catch (e) {
          console.warn('Could not load current event:', e);
          if (card) card.classList.add('hidden');
        }
      }

      // ── Pre-warm the backend ───────────────────────────────────────
      // Apps Script Web Apps have a cold-start delay (1–3 s the first
      // time after idle). Firing a ping on page load means the volunteer's
      // first real scan doesn't pay that cost. Fire-and-forget.
      if (BACKEND_URL) {
        fetch(`${BACKEND_URL}?action=ping`, { method: 'GET', cache: 'no-store' })
          .catch(() => { /* ignore — non-essential */ });
      }

      // Kick off the stats + cache prefill in parallel with everything
      // else. If this call fails (older backend, no event picker set),
      // the app still works normally — first scan triggers prefetch.
      loadCurrentEvent();

      // Allow ?id=... in the page URL to trigger a lookup immediately (useful for testing).
      const pageParams = new URLSearchParams(window.location.search);
      const initialId = pageParams.get('id');
      if (initialId) lookupRegistrant(initialId);
    })();
  </script>
</body>
</html>
